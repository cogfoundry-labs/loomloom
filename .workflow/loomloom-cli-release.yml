version: '1.0'
name: loomloom-cli-release-gitee-v1
displayName: LoomLoom-CLI-Release-Gitee-V1

triggers:
  trigger: auto
  push:
    tags:
      include:
        - ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc|internal)\.[0-9]+)?$

variables:
  global:
    - LOOMLOOM_GITEE_TOKEN

stages:
  - name: release
    displayName: Release
    strategy: naturally
    trigger: auto
    steps:
      - step: build@golang
        name: build_and_publish_gitee_release
        displayName: Build and Publish Gitee Release
        golangVersion: 1.23
        commands:
          - |
            set -euo pipefail

            git fetch --tags --force

            tag_name="${GITEE_TAG:-}"
            ref_name="${GITEE_REF_NAME:-}"
            if [ -z "$tag_name" ] && echo "$ref_name" | grep -Eq '^v'; then
              tag_name="$ref_name"
            fi
            supported_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc|internal)\.[0-9]+)?$'
            stable_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'

            if [ -z "$tag_name" ]; then
              tag_name="$(git tag --points-at "${GITEE_COMMIT:-HEAD}" | grep -E "$supported_tag_pattern" | head -n 1 || true)"
            fi

            if [ -z "$tag_name" ]; then
              echo "no supported release tag detected; skipping non-tag pipeline run"
              exit 0
            fi

            if ! echo "$tag_name" | grep -Eq "$supported_tag_pattern"; then
              echo "resolved tag '$tag_name' is not a supported release tag" >&2
              exit 1
            fi

            is_stable=false
            if echo "$tag_name" | grep -Eq "$stable_tag_pattern"; then
              is_stable=true
            fi

            if [ "$is_stable" = true ] && [ -z "${LOOMLOOM_GITEE_TOKEN:-}" ]; then
              echo "LOOMLOOM_GITEE_TOKEN is required" >&2
              exit 1
            fi

            echo "$tag_name" > .release-tag
            echo "release tag: $tag_name"

            go env -w GOPROXY=https://goproxy.cn,direct
            go env -w GOSUMDB=sum.golang.google.cn
            go env -w GONOSUMDB=

            go version
            go env GOVERSION GOROOT GOPROXY GOSUMDB

            cd cli
            go test ./...
            cd ..

            scripts/package-release-assets.sh --version "$tag_name"
            scripts/validate-release-assets.sh release

            echo "verified Gitee-built release assets:"
            find release -maxdepth 1 -type f -print | sort

            if [ "$is_stable" = true ]; then
              GITEE_SYNC_TOKEN="$LOOMLOOM_GITEE_TOKEN" \
                scripts/publish-gitee-release.sh \
                  --repo cogfoundry/loomloom \
                  --tag "$tag_name" \
                  --assets-dir release

              echo "published Gitee release: https://gitee.com/cogfoundry/loomloom/releases/tag/$tag_name"
            else
              echo "test tag build completed; skipping Gitee release publication: $tag_name"
            fi

        caches:
          - /go/pkg/mod
