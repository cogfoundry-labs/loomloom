name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/Cogfoundry-ai/loomloom/issues) first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
      placeholder: When I run ..., I expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or steps so we can reproduce the problem.
      placeholder: |
        1. Run `loomloom ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste any relevant error output. Redact tokens, API keys, and private data.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: LoomLoom version
      description: Output of `loomloom --version`.
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14 / Ubuntu 22.04 / Windows 11
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: My report contains no secrets, API keys, or tokens.
          required: true
