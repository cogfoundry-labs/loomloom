name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install npm distribution tooling
        run: |
          npm install --global npm@11.19.1
          npm --prefix npm ci --ignore-scripts

      - name: Test npm distribution tooling
        run: |
          npm --prefix npm test
          npm --prefix npm audit --audit-level=high

      - name: Test CLI
        run: |
          scripts/template-spec-docs.sh prepare-checked
          (cd src/cli && go test ./...)

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Test installation and release scripts
        run: |
          scripts/test-download-github-release-assets.sh
          scripts/test-install.sh
          scripts/test-publish-gitlab-release.sh
          scripts/test-release-repository-identity.sh
          scripts/test-release-source-branch.sh
          scripts/test-sync-release-refs.sh
          scripts/test-uninstall.sh
