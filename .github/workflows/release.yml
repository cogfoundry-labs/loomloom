name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish to Gitee
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: loomloom-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release channel
        id: release_channel
        run: |
          tag="$RELEASE_TAG"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            {
              echo "stable=true"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "homebrew=true"
            } >> "$GITHUB_OUTPUT"
            echo "release channel: stable"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|internal)\.[0-9]+$ ]]; then
            {
              echo "stable=false"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "homebrew=false"
            } >> "$GITHUB_OUTPUT"
            echo "release channel: prerelease"
          else
            echo "unsupported release tag: $tag" >&2
            echo "expected vX.Y.Z or vX.Y.Z-beta.N / vX.Y.Z-rc.N / vX.Y.Z-internal.N" >&2
            exit 1
          fi

      - name: Resolve existing tag for manual republish
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"

      - name: Validate stable release source
        if: github.event_name == 'push' && steps.release_channel.outputs.stable == 'true'
        run: |
          git fetch origin main
          release_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "stable release tag must point to a commit on origin/main: $RELEASE_TAG" >&2
            exit 1
          fi

          latest_stable="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ "$RELEASE_TAG" != "$latest_stable" ]; then
            echo "stable release tag is not the latest stable version: $RELEASE_TAG (latest: $latest_stable)" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        if: github.event_name == 'push'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install documentation tooling
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep

      - name: Package release assets once
        if: github.event_name == 'push'
        run: scripts/package-release-assets.sh --version "$RELEASE_TAG"

      - name: Upload packaged assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release/*

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          make_latest: ${{ steps.release_channel.outputs.make_latest }}
          fail_on_unmatched_files: true

      - name: Download existing GitHub release assets for manual republish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          test -f release/checksums.txt

      - name: Sync release refs to Gitee
        env:
          GITEE_SYNC_TOKEN: ${{ secrets.GITEE_SYNC_TOKEN }}
          GITEE_REPOSITORY: cogfoundry/loomloom
          RELEASE_STABLE: ${{ steps.release_channel.outputs.stable }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_SYNC_TOKEN:-}" ]; then
            echo "GITEE_SYNC_TOKEN is required" >&2
            exit 1
          fi

          tag_ref="refs/tags/${RELEASE_TAG}"
          release_sha="$(git rev-list -n 1 "$tag_ref")"
          gitee_url="https://oauth2:${GITEE_SYNC_TOKEN}@gitee.com/${GITEE_REPOSITORY}.git"

          git remote add gitee "$gitee_url"
          git push gitee "${tag_ref}:${tag_ref}"

          if [ "$RELEASE_STABLE" = "true" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            current_main="$(git ls-remote gitee refs/heads/main | awk '{print $1}')"
            if [ -n "$current_main" ]; then
              git push \
                --force-with-lease="refs/heads/main:${current_main}" \
                gitee "${release_sha}:refs/heads/main"
            else
              git push gitee "${release_sha}:refs/heads/main"
            fi
            echo "synced stable ${RELEASE_TAG} to Gitee main"
          else
            echo "kept Gitee main unchanged for ${RELEASE_TAG}"
          fi

      - name: Publish the same assets to Gitee release
        env:
          GITEE_SYNC_TOKEN: ${{ secrets.GITEE_SYNC_TOKEN }}
        run: |
          scripts/publish-gitee-release.sh \
            --repo cogfoundry/loomloom \
            --tag "$RELEASE_TAG" \
            --assets-dir release \
            --prerelease "${{ steps.release_channel.outputs.prerelease }}"

      - name: Update Homebrew tap
        if: github.event_name == 'push' && steps.release_channel.outputs.homebrew == 'true'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not configured; skipping Homebrew tap update." >&2
            exit 0
          fi

          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/Cogfoundry-ai/homebrew-tap.git" "$tap_dir"
          ./scripts/render-homebrew-formula.sh --tag "$RELEASE_TAG" --checksums release/checksums.txt > "$tap_dir/Formula/loomloom.rb"
          rm -f "$tap_dir/Formula/batchjob-cli.rb"

          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --short -- Formula/loomloom.rb Formula/batchjob-cli.rb)" ]]; then
            echo "Formula/loomloom.rb is already up to date"
            exit 0
          fi

          git add -A Formula
          git commit -m "loomloom ${RELEASE_TAG}"
          git push origin main
