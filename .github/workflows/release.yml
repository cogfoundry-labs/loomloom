name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag whose mirror refs should be verified or repaired
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GITEE_REPOSITORY: cogfoundry/loomloom
  GITLAB_REPOSITORY: cogfoundry/loomloom

concurrency:
  group: loomloom-release
  cancel-in-progress: false

jobs:
  github_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_branch: ${{ steps.release_source.outputs.branch }}
      stable: ${{ steps.release_channel.outputs.stable }}
      homebrew: ${{ steps.release_channel.outputs.homebrew }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release channel
        id: release_channel
        run: |
          tag="$RELEASE_TAG"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            {
              echo "stable=true"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "homebrew=true"
            } >> "$GITHUB_OUTPUT"
            echo "release channel: stable"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc|internal)\.[0-9]+$ ]]; then
            {
              echo "stable=false"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "homebrew=false"
            } >> "$GITHUB_OUTPUT"
            echo "release channel: prerelease"
          else
            echo "unsupported release tag: $tag" >&2
            echo "expected vX.Y.Z or vX.Y.Z-beta.N / vX.Y.Z-rc.N / vX.Y.Z-internal.N" >&2
            exit 1
          fi

      - name: Resolve existing tag for manual republish
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"

      - name: Inspect GitHub release state
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          matches="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,isDraft \
              --jq ".[] | select(.tagName == \"${RELEASE_TAG}\") | if .isDraft then \"draft\" else \"published\" end" \
              | sed '/^$/d'
          )"
          match_count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$match_count" -gt 1 ]; then
            echo "multiple GitHub releases found for tag: $RELEASE_TAG" >&2
            exit 1
          fi

          state="${matches:-none}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$state" != "published" ]; then
            echo "manual republish requires an existing published GitHub release: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "GitHub release state for $RELEASE_TAG: $state"

      - name: Resolve release source branch
        id: release_source
        run: |
          args=("$RELEASE_TAG")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--allow-history)
          fi
          source_branch="$(scripts/resolve-release-source-branch.sh "${args[@]}")"
          echo "branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "validated release source branch: $source_branch"

      - uses: actions/setup-go@v5
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test CLI
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        run: go test ./...
        working-directory: cli

      - name: Test release scripts
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        run: |
          bash -n scripts/resolve-release-source-branch.sh
          bash -n scripts/sync-release-refs.sh
          bash -n scripts/sync-gitee-release-refs.sh
          scripts/test-release-source-branch.sh
          scripts/test-sync-release-refs.sh
          scripts/test-release-repository-identity.sh

      - name: Package release assets once
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        run: |
          scripts/package-release-assets.sh --version "$RELEASE_TAG"
          scripts/validate-release-assets.sh release

      - name: Upload packaged assets
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}-attempt-${{ github.run_attempt }}
          path: release/*

      - name: Upload assets to GitHub draft release
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          draft: true
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Verify GitHub draft release assets
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verification_dir="$RUNNER_TEMP/github-release-verification"
          rm -rf "$verification_dir"
          mkdir -p "$verification_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verification_dir"
          if ! cmp -s release/checksums.txt "$verification_dir/checksums.txt"; then
            echo "GitHub draft release does not match the current build: $RELEASE_TAG" >&2
            exit 1
          fi
          scripts/validate-release-assets.sh "$verification_dir"

      - name: Publish verified GitHub draft release
        if: github.event_name == 'push' && steps.github_release.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ steps.release_channel.outputs.stable }}
        run: |
          set -euo pipefail

          args=(
            release edit "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft=false
          )
          if [ "$RELEASE_STABLE" = "true" ]; then
            args+=(--latest)
          fi
          gh "${args[@]}"

      - name: Download published GitHub release assets
        if: github.event_name == 'workflow_dispatch' || steps.github_release.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          scripts/validate-release-assets.sh release

  sync_gitee:
    needs: github_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Sync source branch and release tag to Gitee
        env:
          GITEE_SYNC_TOKEN: ${{ secrets.GITEE_SYNC_TOKEN }}
        run: |
          args=(
            --provider gitee
            --repo "$GITEE_REPOSITORY"
            --branch "${{ needs.github_release.outputs.source_branch }}"
            --tag "$RELEASE_TAG"
          )
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--allow-history)
          fi
          scripts/sync-release-refs.sh "${args[@]}"

  sync_gitlab:
    needs: github_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Sync source branch and release tag to GitLab
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          args=(
            --provider gitlab
            --repo "$GITLAB_REPOSITORY"
            --branch "${{ needs.github_release.outputs.source_branch }}"
            --tag "$RELEASE_TAG"
          )
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--allow-history)
          fi
          scripts/sync-release-refs.sh "${args[@]}"

  update_homebrew:
    if: github.event_name == 'push' && needs.github_release.outputs.homebrew == 'true'
    needs: github_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          scripts/validate-release-assets.sh release

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not configured; skipping Homebrew tap update." >&2
            exit 0
          fi

          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/cogfoundry-labs/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          ./scripts/render-homebrew-formula.sh --tag "$RELEASE_TAG" --checksums release/checksums.txt > "$tap_dir/Formula/loomloom.rb"
          rm -f "$tap_dir/Formula/batchjob-cli.rb"

          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --short -- Formula/loomloom.rb Formula/batchjob-cli.rb)" ]]; then
            echo "Formula/loomloom.rb is already up to date"
            exit 0
          fi

          git add -A Formula
          git commit -m "loomloom ${RELEASE_TAG}"
          git push origin main
