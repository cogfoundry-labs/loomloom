# Raw Arena.ai Text-to-Image Arena data — the ONLY place a model's quality
# judgment is hand-entered. Nothing here is a derived or hand-computed score:
# every elo/margin pair below is exactly what arena.ai displayed for that
# model in that category on snapshot_date. image.py's compute_arena_scores()
# turns this into per-dimension [-1, 2] scores at load time (see the
# confidence-interval-aware tiering described in
# docs/plans/2026-09-13-image-lab-arena-scoring-implementation.md) — nobody
# should ever hand-type a score into model-catalog.yaml again; re-measuring
# means re-pulling this file, not editing a score by hand.
#
# Source: https://arena.ai/leaderboard/image/text-to-image and its category pages (commercial-design,
#   3d-modeling, cartoon, photorealistic, art, portraits, text-rendering) — pulled 2026-10-11; the boards
#   were dated Oct 8, 2026 and listed 82 models. (The previous pull, 2026-09-08, read a 78-model board at
#   arena.ai/leaderboard/text-to-image/<category>, which now redirects here.)
#
# Some models have several entries on a board; each catalog model is taken from the same entry in every
# category: openai/gpt-image-2.5-sunburst = gpt-image-2.5-sunburst; openai/gpt-image-2.5-flare = gpt-image-2.5-flare; openai/gpt-image-2 = gpt-image-2 (medium); google/gemini-3.1-flash-image = gemini-3.1-flash-image (nano-banana-2) [web-search]; google/gemini-3-pro-image = gemini-3-pro-image-2k (nano-banana-pro); bytedance/doubao-seedream-5-0-pro = seedream-5.0-pro; google/gemini-2.5-flash-image = gemini-2.5-flash-image-preview (nano-banana); bytedance/doubao-seedream-4.5 = seedream-4.5; bytedance/doubao-seedream-5-0-lite = seedream-5.0-lite.
#
# `margin` is arena's displayed "±" next to each Elo rating — confirmed via
# arena.ai/blog/arena-rank and the lmarena/arena-rank package it describes to
# be a genuine 95% confidence-interval half-width from a Bradley-Terry model
# fit to head-to-head votes (originally bootstrap-resampled, now closed-form).
# ONE THING THIS DOES NOT CONFIRM: whether that single displayed number is an
# exact symmetric half-width, or a symmetrized simplification of a possibly
# slightly asymmetric underlying interval. Treated as a roughly-Gaussian 95%
# half-width for tiering purposes — standard practice for leaderboard-grade
# analysis, but a disclosed approximation, not a certainty. If this ever gets
# resolved from primary sources, revisit compute_arena_scores()'s tiering;
# until then the risk is "a few borderline tier boundaries shift slightly,"
# not "the whole method is invalid."
#
# When re-pulling: update snapshot_date and every elo/margin pair together —
# they are one leaderboard snapshot, not independently-dated facts.
