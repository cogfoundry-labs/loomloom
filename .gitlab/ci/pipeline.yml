stages:
  - test
  - package
  - publish
  - release
  - sync

variables:
  GIT_DEPTH: "0"
  GITEE_REPOSITORY: "cogfoundry/loomloom"
  GITLAB_RELEASE_PACKAGE_NAME: "loomloom"

validate_release_source:
  stage: test
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash git
  script:
    - source_branch="$(scripts/resolve-release-source-branch.sh "$CI_COMMIT_TAG")"
    - echo "validated release source branch $source_branch"

test_cli:
  stage: test
  image: golang:1.23-bookworm
  script:
    - cd cli
    - go test ./...

test_release_scripts:
  stage: test
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash git jq
  script:
    - bash -n scripts/resolve-release-source-branch.sh
    - bash -n scripts/sync-gitee-release-refs.sh
    - bash -n scripts/publish-gitlab-release.sh
    - scripts/test-release-source-branch.sh
    - scripts/test-publish-gitlab-release.sh

package_release:
  stage: package
  image: golang:1.23-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(internal|beta|rc)\.[0-9]+)?$/'
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends zip
  script:
    - scripts/package-release-assets.sh --version "$CI_COMMIT_TAG"
    - scripts/validate-release-assets.sh release
  artifacts:
    name: "loomloom-$CI_COMMIT_TAG"
    paths:
      - release/
    expire_in: 7 days

publish_gitlab_package:
  stage: publish
  image: alpine:3.22
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(internal|beta|rc)\.[0-9]+)?$/'
  needs:
    - job: package_release
      artifacts: true
  before_script:
    - apk add --no-cache bash ca-certificates curl jq
  script:
    - scripts/publish-gitlab-release.sh upload release

create_gitlab_release:
  stage: release
  image: alpine:3.22
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(internal|beta|rc)\.[0-9]+)?$/'
  needs:
    - job: package_release
      artifacts: true
    - job: publish_gitlab_package
      artifacts: false
  before_script:
    - apk add --no-cache bash ca-certificates curl jq
  script:
    - scripts/publish-gitlab-release.sh release release

sync_gitee_release:
  stage: sync
  image: alpine:3.22
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(internal|beta|rc)\.[0-9]+)?$/'
  needs:
    - job: create_gitlab_release
      artifacts: false
  before_script:
    - apk add --no-cache bash ca-certificates git
  script:
    - source_branch="$(scripts/resolve-release-source-branch.sh "$CI_COMMIT_TAG")"
    - echo "release source branch $source_branch"
    - scripts/sync-gitee-release-refs.sh --repo "$GITEE_REPOSITORY" --branch "$source_branch" --tag "$CI_COMMIT_TAG"
